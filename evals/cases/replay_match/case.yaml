name: replay_match
description: Replays recorded model responses and matches the tool-call sequence.
task: Read a.txt once.
responses:
  - tool_calls:
      - id: call_a
        name: read_file
        arguments:
          path: a.txt
  - content: "Read a.txt."
expected:
  tool_called: [read_file]
  run_status_equals: completed
  replay:
    matches: true
